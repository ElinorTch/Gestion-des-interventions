<div>
    <p>
        <b>Matricule Etudiant : </b>
        {{intervention.etudiant.matricule}}
    </p>
    <p>
        <b>Nom : </b>
        {{intervention.sousCategorie.libelle}}
    </p>
    <p>
        <b>Description : </b>
        {{intervention.libelleIntervention}}
    </p>
    <p *ngIf="intervention.personnel != null">
        <b>Personnel : </b>
        {{intervention.personnel.nom}} {{intervention.personnel.prenom}}
    </p>
    <p>
        <b>Status : </b>
        {{intervention.status}}
    </p>
</div>
